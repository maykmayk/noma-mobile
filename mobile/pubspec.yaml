name: noma
description: Cycling GPS app — maps, GPX tracks, navigation, Apple Health.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7

  # State management + DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.9.1

  # Maps (OpenStreetMap, offline support)
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^9.1.4
  latlong2: ^0.9.1

  # GPS tracking
  geolocator: ^13.0.2

  # GPX parse / export
  gpx: ^2.3.0

  # Apple Health / Google Fit
  health: ^12.2.0

  # File picker (GPX import)
  file_picker: ^10.3.10

  # Permissions
  permission_handler: ^11.3.1

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.4

  # User preferences (non-sensitive)
  shared_preferences: ^2.3.2

  # External links
  url_launcher: ^6.3.1

  # Data models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5

  # Code generation
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  go_router_builder: ^2.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/avatars/
    - assets/translations/
    - assets/flags/

  fonts:
    - family: OpenRunde
      fonts:
        - asset: assets/fonts/OpenRunde-Regular.otf
          weight: 400
        - asset: assets/fonts/OpenRunde-Medium.otf
          weight: 500
        - asset: assets/fonts/OpenRunde-Semibold.otf
          weight: 600
        - asset: assets/fonts/OpenRunde-Bold.otf
          weight: 700
